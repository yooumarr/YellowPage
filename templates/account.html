{% extends "base.html" %}
{% block title %}Account{% endblock %}

{% block content %}
  <h1>Your account</h1>
  <p class="meta">You are signed in as {{ g.user.username }}.</p>

  <h2 class="account-heading">Change username</h2>
  <form method="post" action="{{ url_for('change_username') }}">
    <label for="new-username">New username</label>
    <input id="new-username" name="username" required autocomplete="username"
           value="{{ g.user.username }}">

    <label for="username-password">Current password</label>
    <input id="username-password" name="current_password" type="password" required
           autocomplete="current-password">

    <div class="actions">
      <button type="submit">Save username</button>
    </div>
  </form>

  <h2 class="account-heading">Change password</h2>
  <form method="post" action="{{ url_for('change_password') }}">
    <label for="current-password">Current password</label>
    <input id="current-password" name="current_password" type="password" required
           autocomplete="current-password">

    <label for="new-password">New password</label>
    <input id="new-password" name="new_password" type="password" required
           autocomplete="new-password" minlength="4">

    <div class="actions">
      <button type="submit">Save password</button>
    </div>
  </form>
{% endblock %}
